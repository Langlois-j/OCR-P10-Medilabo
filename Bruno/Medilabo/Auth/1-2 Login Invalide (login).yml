info:
  name: 1-2 Login Invalide (login)
  type: http
  seq: 3

http:
  method: POST
  url: "{{authUrl}}/auth/login"
  body:
    type: json
    data: |-
      {
        "username": "{{vUsername}}",
        "password": "{{vPassword}}"
      }
  auth: inherit

runtime:
  variables:
    - name: vUsername
      value: inconnu
    - name: vPassword
      value: Admin#2026
  assertions:
    - expression: res.status
      operator: eq
      value: "401"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
