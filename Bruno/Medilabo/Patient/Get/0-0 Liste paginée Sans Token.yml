info:
  name: 0-0 Liste paginée Sans Token
  type: http
  seq: 1

http:
  method: GET
  url: "{{patientUrl}}/patients?page=1&pageSize=20"
  params:
    - name: page
      value: "1"
      type: query
    - name: pageSize
      value: "20"
      type: query

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "401"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
