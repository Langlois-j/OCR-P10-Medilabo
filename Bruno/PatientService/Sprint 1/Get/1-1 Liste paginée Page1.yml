info:
  name: 1-1 Liste paginée Page1
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/patients?page=1&pageSize=20"
  params:
    - name: page
      value: "1"
      type: query
    - name: pageSize
      value: "20"
      type: query
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.totalCount
      operator: gte
      value: "4"
    - expression: res.body.items.length
      operator: gte
      value: "4"
    - expression: res.body.page
      operator: eq
      value: "1"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
