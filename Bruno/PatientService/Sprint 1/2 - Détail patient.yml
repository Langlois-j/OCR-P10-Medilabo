info:
  name: 2 - Détail patient
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/patients/1"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.lastName
      operator: eq
      value: TestNone

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
