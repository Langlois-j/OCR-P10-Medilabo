info:
  name: 4-3 - Mise à jour patient copy Bad name
  type: http
  seq: 8

http:
  method: PUT
  url: "{{baseUrl}}/patients/{{createdId}}"
  body:
    type: json
    data: |-
      {
        "firstName": "",
        "lastName": "Doe",
        "birthDate": "1990-05-20",
        "gender": "F",
        "address": "10 Rue Test",
        "phoneNumber": "500-666-7777"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
