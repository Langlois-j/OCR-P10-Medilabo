info:
  name: 5-2 - Création sans genre
  type: http
  seq: 10

http:
  method: POST
  url: "{{baseUrl}}/patients"
  body:
    type: json
    data: |-
      {
        "firstName": "Jane",
        "lastName": "Doe",
        "birthDate": "1990-05-20"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
