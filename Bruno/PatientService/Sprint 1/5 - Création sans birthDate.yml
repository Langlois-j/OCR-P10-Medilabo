info:
  name: 5 - Création sans birthDate
  type: http
  seq: 9

http:
  method: POST
  url: "{{baseUrl}}/patients"
  body:
    type: json
    data: |-
      {
        "firstName": "Jane",
        "lastName": "Doe",
        "gender": "F"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
